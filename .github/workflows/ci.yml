name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: ai-journey assess examples/org-assessment.json --output roadmap.md
      - run: ai-journey progress examples/org-assessment.json examples/org-assessment-q2.json --output progress.md
      - run: ai-journey readiness examples/org-assessment.json --output readiness.md
      - run: ai-journey readiness examples/org-assessment-q2.json --output /dev/null
      - name: a placeholder must not count as evidence
        run: |
          printf '{"organization":"X","evidence":{"product":"TBD"},"scores":{"product":3,"workflow":3,"evaluation":3,"architecture":3,"platform":3,"governance":3,"learning":3}}' > /tmp/placeholder.json
          if ai-journey assess /tmp/placeholder.json; then
            echo 'expected a non-zero exit for placeholder evidence' && exit 1
          fi
      - name: profiles in the wrong order must exit non-zero
        run: |
          if ai-journey progress examples/org-assessment-q2.json examples/org-assessment.json; then
            echo 'expected a non-zero exit for reversed profiles' && exit 1
          fi
      - name: an invalid profile must exit non-zero
        run: |
          printf '{"organization":"X","scores":{"product":9}}' > /tmp/bad.json
          if ai-journey assess /tmp/bad.json; then
            echo 'expected a non-zero exit for an invalid profile' && exit 1
          fi
