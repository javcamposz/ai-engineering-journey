name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: ai-journey assess examples/org-assessment.json --output roadmap.md
      - name: an invalid profile must exit non-zero
        run: |
          printf '{"organization":"X","scores":{"product":9}}' > /tmp/bad.json
          if ai-journey assess /tmp/bad.json; then
            echo 'expected a non-zero exit for an invalid profile' && exit 1
          fi
